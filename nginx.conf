# Capacitación: portada con los cursos habilitados, una página por curso (/<slug>), videos en /recursos/,
# panel de evaluadores en /panel/ (también arma y corrige los exámenes: sin n8n desde 2026-11-17).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # redirecciones relativas: detrás de Cloudflare el esquema es https

    # El upstream se resuelve al usar (variable + resolver de Docker): así nginx arranca aunque el panel esté apagado.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $panel http://capacitacion-panel:8000;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Portada: lista de cursos habilitados (la arma con /panel/publico/cursos).
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }

    # Panel de evaluadores (login propio). Sin cámara.
    location = /panel { return 301 /panel/; }
    location ^~ /panel/ {
        client_max_body_size 64k;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    # Subida de videos por partes de 32 MB (Cloudflare corta los cuerpos de más de 100 MB).
    location ^~ /panel/api/subir/ {
        client_max_body_size 40m;
        proxy_request_buffering off;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Videos y archivos de los cursos (se suben desde el panel). nginx atiende Range: se puede adelantar el video.
    location ^~ /recursos/ {
        alias /usr/share/nginx/recursos/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }          # .subiendo-* (subidas a medias)
    }

    # Guardar las preguntas de un curso (el banco completo de la Ley son ~80 KB) e importar listas de choferes.
    # (prefijo ^~ / exacto =: un location con regex no se evaluaría, /panel/ ya es ^~)
    location ^~ /panel/api/preguntas/ {
        client_max_body_size 8m;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /panel/api/importar {
        client_max_body_size 8m;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /panel/api/importar-sistemas {
        client_max_body_size 32m;     # JDE trae ~25.000 filas
        proxy_read_timeout 300s;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Página de cada curso: /cursomanejo, /seguridadvial... (el contenido lo sirve el panel en /panel/publico/curso/<slug>).
    # La cámara se permite solo acá.
    location ~ "^/[a-z0-9][a-z0-9-]{1,39}/?$" {
        try_files /curso.html =404;
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
