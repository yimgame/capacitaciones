# Capacitación de choferes: página pública (nginx) + panel (FastAPI + SQLite).
#   cp .env.example .env   # y poné una contraseña
#   docker compose up -d --build
# Página: http://localhost:${PUERTO:-8097}/   Panel: http://localhost:${PUERTO:-8097}/panel/
services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${PUERTO:-8097}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./recursos:/usr/share/nginx/recursos:ro
    depends_on: [panel]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  panel:
    build: ./panel
    image: capacitacion-panel:1
    container_name: capacitacion-panel     # nginx.conf lo busca por este nombre
    restart: unless-stopped
    environment:
      - PANEL_ADMIN_PASSWORD=${PANEL_ADMIN_PASSWORD:?Definí PANEL_ADMIN_PASSWORD en .env}
      - PANEL_ADMIN_USER=${PANEL_ADMIN_USER:-admin}
      - PANEL_DB=/data/panel.db
      - RECURSOS_DIR=/recursos
    volumes:
      - ./panel/app:/srv/app:ro            # el código se monta: cambiarlo = reiniciar el panel
      - panel_data:/data                   # base SQLite (+ /data/respaldos, backup diario 30 días)
      - ./recursos:/recursos               # videos y archivos de los cursos
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  panel_data:
